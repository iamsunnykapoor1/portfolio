<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with outer glow -->
  <circle cx="150" cy="150" r="140" fill="url(#bgGrad)" stroke="url(#glowRing)" stroke-width="3" filter="url(#avatarGlow)" />
  
  <!-- Subtle cyber circuit accents -->
  <path d="M 40 150 H 70 L 90 170" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <path d="M 260 150 H 230 L 210 130" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="90" cy="170" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="210" cy="130" r="3" fill="#a855f7" opacity="0.6"/>

  <!-- Character Shoulders / Hoodie -->
  <path d="M 70 270 C 70 215 100 200 150 200 C 200 200 230 215 230 270 Z" fill="url(#hoodie)" />
  <path d="M 115 205 L 150 235 L 185 205" stroke="#4338ca" stroke-width="3" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="135" y="160" width="30" height="40" rx="6" fill="#e0e7ff" opacity="0.9" />

  <!-- Head -->
  <ellipse cx="150" cy="135" rx="42" ry="48" fill="#e0e7ff" />

  <!-- Hair -->
  <path d="M 108 128 C 108 95 125 78 150 78 C 175 78 192 95 192 128 C 192 105 178 88 150 88 C 122 88 112 105 108 128 Z" fill="#312e81" />
  <path d="M 110 115 C 125 90 175 88 190 115 C 182 100 160 92 145 94 C 130 96 118 103 110 115 Z" fill="#4338ca" />

  <!-- Glasses (Modern Tech/Developer vibe) -->
  <rect x="120" y="125" width="24" height="16" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <rect x="156" y="125" width="24" height="16" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <line x1="144" y1="133" x2="156" y2="133" stroke="#38bdf8" stroke-width="2" />
  <!-- Glass reflections -->
  <line x1="124" y1="129" x2="134" y2="137" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="160" y1="129" x2="170" y2="137" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Friendly smile -->
  <path d="M 142 160 Q 150 166 158 160" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Developer Headphones -->
  <path d="M 105 135 C 105 100 120 70 150 70 C 180 70 195 100 195 135" stroke="#6366f1" stroke-width="4" stroke-linecap="round" fill="none" />
  <rect x="100" y="122" width="12" height="26" rx="6" fill="#a855f7" />
  <rect x="188" y="122" width="12" height="26" rx="6" fill="#a855f7" />

  <!-- Code bracket floating badges -->
  <g transform="translate(195, 175) scale(0.8)">
    <rect width="60" height="30" rx="15" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="19" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;AI/&gt;</text>
  </g>
  <g transform="translate(45, 175) scale(0.8)">
    <rect width="60" height="30" rx="15" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="30" y="19" fill="#a855f7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">{ML}</text>
  </g>
</svg>
